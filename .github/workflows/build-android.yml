name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Download large truck models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r f; do
            [ -z "$f" ] && continue
            gh release download big-assets -R ${{ github.repository }} -p "$(basename "$f")" -O "$f" --clobber
          done < big-assets.txt
          ls -lh TruckSimHighway/Assets/Resources/Trucks
      - uses: actions/cache@v4
        with:
          path: TruckSimHighway/Library
          key: Library-Android-${{ hashFiles('TruckSimHighway/Assets/**', 'TruckSimHighway/Packages/**', 'TruckSimHighway/ProjectSettings/**') }}
          restore-keys: Library-Android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: TruckSimHighway
          unityVersion: 6000.0.85f2
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: TruckSimHighway
      - name: Find APK
        run: |
          APK=$(find build -name '*.apk' | head -1)
          echo "Found $APK"
          cp "$APK" TruckSimHighway.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TruckSimHighway-apk
          path: TruckSimHighway.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TruckSim Highway build ${{ github.run_number }}
          files: TruckSimHighway.apk
          make_latest: true
