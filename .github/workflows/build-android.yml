name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Download large truck models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r f; do
            [ -z "$f" ] && continue
            gh release download big-assets -R ${{ github.repository }} -p "$(basename "$f")" -O "$f" --clobber
          done < big-assets.txt
      - uses: actions/cache@v4
        with:
          path: TruckSimHighway/Library
          key: Library-Android-${{ hashFiles('TruckSimHighway/Assets/**', 'TruckSimHighway/Packages/**', 'TruckSimHighway/ProjectSettings/**') }}
          restore-keys: Library-Android-
      - name: Activate Unity Personal and build APK
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm -e UNITY_EMAIL -e UNITY_PASSWORD -v "$PWD/TruckSimHighway:/project" -w /project \
            unityci/editor:ubuntu-6000.0.85f2-android-3 bash -c '
            set -e
            C=$(find /opt/unity -name Unity.Licensing.Client -type f | head -1)
            $C --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" | tail -5
            unity-editor -batchmode -nographics -quit -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
              -projectPath /project -buildTarget Android \
              -executeMethod TruckSim.EditorTools.ProjectBuilder.BuildAndroid -logFile - ; code=$?
            exit $code'
          ls -lh TruckSimHighway/Builds/Android
          sudo cp TruckSimHighway/Builds/Android/HighwayTruckSim.apk TruckSimHighway.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TruckSimHighway-apk
          path: TruckSimHighway.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TruckSim Highway build ${{ github.run_number }}
          files: TruckSimHighway.apk
          make_latest: true
