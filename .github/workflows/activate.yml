name: Activate Unity license
on: workflow_dispatch
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Activate
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          mkdir -p out
          docker run --rm -e UNITY_EMAIL -e UNITY_PASSWORD -v $PWD/out:/out unityci/editor:ubuntu-6000.0.85f2-android-3 bash -c '
            unity-editor -batchmode -nographics -quit -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -logFile /out/log.txt || true
            find / -name "*.ulf" 2>/dev/null -exec cp {} /out/ \; ; ls /root/.local/share/unity3d/Unity 2>/dev/null; true'
          grep -iE "licens|entitle|error|token" out/log.txt | grep -viE "password" | head -60 || true
          ls out
      - name: Save license secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          f=$(ls out/*.ulf | head -1)
          gh secret set UNITY_LICENSE -R ${{ github.repository }} < "$f"
          echo saved
